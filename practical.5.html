<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-amber-50">

    <div class="text-center py-8">
        <p class="text-orange-500 font-semibold">WELCOME TO</p>
        <h1 class="text-4xl font-bold text-gray-800">
            Delicious <span class="text-orange-500">Food</span>
        </h1>
        <p class="text-gray-500 mt-2">Fresh • Tasty • Delicious</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3
                gap-7 max-w-5xl mx-auto px-6 pb-10">

        <!-- Pizza -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden
                    hover:-translate-y-2 transition">
            <div class="h-44 bg-orange-100 flex items-center
                        justify-center text-7xl">
                🍕
            </div>

            <div class="p-5">
                <h2 class="text-2xl font-bold text-gray-800">
                    Cheese Pizza
                </h2>
                <p class="text-gray-500 mt-2">
                    Crispy crust topped with fresh cheese and herbs.
                </p>

                <div class="flex justify-between items-center mt-5">
                    <span class="text-xl font-bold text-orange-500">
                        ₹299
                    </span>
                    <button class="bg-orange-500 text-white px-5 py-2
                                   rounded-full hover:bg-orange-600">
                        Order Now
                    </button>
                </div>
            </div>
        </div>

        <!-- Burger -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden
                    hover:-translate-y-2 transition">
            <div class="h-44 bg-orange-100 flex items-center
                        justify-center text-7xl">
                🍔
            </div>

            <div class="p-5">
                <h2 class="text-2xl font-bold text-gray-800">
                    Classic Burger
                </h2>
                <p class="text-gray-500 mt-2">
                    Juicy burger with fresh vegetables and special sauce.
                </p>

                <div class="flex justify-between items-center mt-5">
                    <span class="text-xl font-bold text-orange-500">
                        ₹199
                    </span>
                    <button class="bg-orange-500 text-white px-5 py-2
                                   rounded-full hover:bg-orange-600">
                        Order Now
                    </button>
                </div>
            </div>
        </div>

        <!-- Pasta -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden
                    hover:-translate-y-2 transition">
            <div class="h-44 bg-orange-100 flex items-center
                        justify-center text-7xl">
                🍝
            </div>

            <div class="p-5">
                <h2 class="text-2xl font-bold text-gray-800">
                    Creamy Pasta
                </h2>
                <p class="text-gray-500 mt-2">
                    Creamy Italian pasta made with fresh ingredients.
                </p>

                <div class="flex justify-between items-center mt-5">
                    <span class="text-xl font-bold text-orange-500">
                        ₹249
                    </span>
                    <button class="bg-orange-500 text-white px-5 py-2
                                   rounded-full hover:bg-orange-600">
                        Order Now
                    </button>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
