<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <h1 class="text-4xl font-bold text-center text-blue-600 my-8">
        New Product Collection
    </h1>

    <div class="flex flex-col sm:flex-row flex-wrap
                justify-center gap-6 p-6">

        <!-- Product 1 -->
        <div class="bg-white p-5 rounded-xl shadow-md w-full sm:w-64">
            <div class="bg-gray-200 h-40 rounded-lg
                        flex items-center justify-center text-5xl">
                👟
            </div>
            <h2 class="text-xl font-bold mt-4">Running Shoes</h2>
            <p class="text-gray-500">Comfortable & stylish</p>
            <p class="text-blue-600 font-bold mt-2">₹1,999</p>
            <button class="bg-blue-600 text-white px-4 py-2
                           rounded-lg mt-3 hover:bg-blue-700">
                Buy Now
            </button>
        </div>

        <!-- Product 2 -->
        <div class="bg-white p-5 rounded-xl shadow-md w-full sm:w-64">
            <div class="bg-gray-200 h-40 rounded-lg
                        flex items-center justify-center text-5xl">
                🎧
            </div>
            <h2 class="text-xl font-bold mt-4">Headphones</h2>
            <p class="text-gray-500">Wireless & powerful</p>
            <p class="text-blue-600 font-bold mt-2">₹2,499</p>
            <button class="bg-blue-600 text-white px-4 py-2
                           rounded-lg mt-3 hover:bg-blue-700">
                Buy Now
            </button>
        </div>

        <!-- Product 3 -->
        <div class="bg-white p-5 rounded-xl shadow-md w-full sm:w-64">
            <div class="bg-gray-200 h-40 rounded-lg
                        flex items-center justify-center text-5xl">
                ⌚
            </div>
            <h2 class="text-xl font-bold mt-4">Smart Watch</h2>
            <p class="text-gray-500">Smart & modern</p>
            <p class="text-blue-600 font-bold mt-2">₹3,499</p>
            <button class="bg-blue-600 text-white px-4 py-2
                           rounded-lg mt-3 hover:bg-blue-700">
                Buy Now
            </button>
        </div>

    </div>

</body>
</html>
